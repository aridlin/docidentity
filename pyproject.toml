[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "docidentity"
version = "0.3.0"
description = "Local LibreOffice document identities, Code 128 barcodes and lineage"
requires-python = ">=3.11"
[project.scripts]
docidentity = "docidentity.cli:main"
[tool.setuptools]
packages = ["docidentity"]
